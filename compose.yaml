services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=user'
      - 'POSTGRES_USER=user'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d mydatabase" ]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbit-source
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - source_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ../pd-tickets-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SOURCE_RABBITMQ_HOST: rabbitmq
      SOURCE_RABBITMQ_PORT: "5672"
      SOURCE_RABBITMQ_USER: user
      SOURCE_RABBITMQ_PASSWORD: user
      SOURCE_RABBITMQ_QUEUE: incoming
      TARGET_RABBITMQ_HOST: rabbitmq
      TARGET_RABBITMQ_PORT: "5672"
      TARGET_RABBITMQ_USER: user
      TARGET_RABBITMQ_PASSWORD: user
      TARGET_RABBITMQ_QUEUE: processed
      PREFETCH_COUNT: "10"
      LOG_LEVEL: INFO
    restart: unless-stopped
  ui:
    build: ../pd-tickets-ui
    container_name: pd-tickets-ui
    ports:
      - "8081:80"

  app:
    build: .
    container_name: pd-tickets-app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: user
      APP_RABBITMQ_INCOMING_QUEUE: incoming
      APP_RABBITMQ_TARGET_QUEUE: processed
    ports:
      - "8080:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  ollama:
    image: ollama/ollama:latest
    container_name: pd-tickets-ollama
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  source_data:
  target_data:
  postgres_data:
  keycloak_data:
  ollama_data:
