spring.application.name=pd-tickets
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/pd-tickets
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/pd-tickets/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=pd-tickets-api

# Redis jako cache listy zgłoszeń (lokalnie: localhost, w Dockerze nadpisywane zmiennymi SPRING_DATA_REDIS_*)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Krótkie timeouty: gdy Redis nie działa, zapytanie szybko się nie powiedzie i aplikacja czyta z bazy
# (bez tego klient Redisa czeka domyślnie do 60 s i UI nie dostaje odpowiedzi)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.key-prefix=pd-tickets::
spring.cache.redis.use-key-prefix=true
logging.level.org.example.pdtickets=INFO
